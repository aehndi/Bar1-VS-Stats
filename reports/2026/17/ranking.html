            width: 300px;
            font-size: 14px;
        }
        table {
            width: 100%;

            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background-color: #2980b9;
        }
        th.sort-asc::after {
            content: ' ▲';
            font-size: 0.8em;
        }
        th.sort-desc::after {
            content: ' ▼';
            font-size: 0.8em;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .points {
            text-align: right;
        }
        .points.low-points {
            background-color: #ffcccc; /* Red */
        }
        .points.mid-points {
            background-color: #ffffcc; /* Yellow */
        }
        .points.high-points {
            background-color: #ccffcc; /* Green */
        }
        .points.white-points {
            background-color: #ffffff; /* White */
        }
        .sum-col {
            font-weight: bold;
            background-color: #f9f9f9;
        }
        .mode-selector {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #eee;
            padding: 10px 15px;
            border-radius: 4px;
        }
        .mode-selector label {
            cursor: pointer;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #95a5a6;
        }
    </style>
</head>

        function renderTable() {

                container.innerHTML = `<div class="no-data">${currentSearch ? 'No matches found.' : 'No rankings found for this period.'}</div>`;
                return;
            }

            // Build Table
            let html = '<table><thead><tr>';
            
            const getSortClass = (col) => {
                if (currentSort.column === col) {
                    return currentSort.direction === 'asc' ? 'class="sort-asc"' : 'class="sort-desc"';
                }
                return '';
            };

            html += `<th onclick="sortTable('rank')" ${getSortClass('rank')}>Rank</th>`;
            html += `<th onclick="sortTable('name')" ${getSortClass('name')}>Player</th>`;
            
            allDates.forEach((date, idx) => {
                const dParts = date.split('-');
                const label = dParts.length === 3 ? `${dParts[2]}.${dParts[1]}.` : date;

                    const val = p !== undefined ? p : 0;
                    const displayPoints = val.toLocaleString('en-US');
                    
                    let colorClass = '';
                    if (currentMode === 'eco') {
                        if (val <= 2300000) colorClass = 'low-points';
                        else colorClass = 'high-points';
                    } else {
                        // Normal mode
                        if (val <= 2300000) colorClass = 'low-points';
                        else if (val < 7200000) colorClass = 'mid-points';
                        else colorClass = 'high-points';
                    }
                    
                    html += `<td class="points ${colorClass}">${displayPoints}</td>`;
                });
                
                let totalColorClass = '';
                const total = player.total;
                if (currentMode === 'eco') {
                    // Eco: >4x2.3M (9.2M) and <45M green, else white
                    if (total > 9200000 && total < 45000000) {
                        totalColorClass = 'high-points';
                    } else {
                        totalColorClass = 'white-points';
                    }
                } else {
                    // Normal: <4x2.3M (9.2M) red, <4x7.2M (28.8M) yellow, else green
                    if (total < 9200000) totalColorClass = 'low-points';
                    else if (total < 28800000) totalColorClass = 'mid-points';
                    else totalColorClass = 'high-points';
                }

                html += `<td class="points sum-col ${totalColorClass}">${player.total.toLocaleString('en-US')}</td>`;
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

            } else {
                filteredPlayersList = fullPlayersList.filter(p => p.name.toLowerCase().includes(currentSearch));
            }
            renderTable();
        }

                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = (column === 'name' || column === 'rank') ? 'asc' : 'desc';
            }

            fullPlayersList.sort((a, b) => {
                let valA, valB;
                if (column === 'rank') {
                    valA = a.rank;
                    valB = b.rank;
                } else if (column === 'name') {
                    valA = a.name.toLowerCase();
                    valB = b.name.toLowerCase();
                } else if (column === 'total') {
                    valA = a.total;
                    valB = b.total;
                } else if (column.startsWith('date_')) {
                    const idx = parseInt(column.split('_')[1]);
                    const date = allDates[idx];
                    valA = a.dailyPoints[date] || 0;
                    valB = b.dailyPoints[date] || 0;
                }

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            applyFilter();
        }
        
        function init() {
            const container = document.getElementById('tableContainer');
            const title = document.getElementById('dashboardTitle');
            
            if (!allData || allData.length === 0) {
                container.innerHTML = '<div class="no-data">No data available.</div>';
                return;
            }
            
            const data = allData[0];
            let titleText = `Bar1 Ranking Dashboard - ${data.event.toUpperCase()} ${data.year}, Week ${data.week}`;
            
            const days = data.days || [];
            if (days.length === 1) {
                const dParts = days[0].date.split('-');
                if (dParts.length === 3) {
                    titleText = `Bar1 Ranking Dashboard - ${dParts[2]}.${dParts[1]}.${dParts[0]}`;
                }
            }
            title.textContent = titleText;
            
            allDates = days.map(d => d.date).sort();
            
            const playersMap = new Map();
            days.forEach(day => {
                const date = day.date;
                day.entries.forEach(entry => {
                    if (!playersMap.has(entry.name)) {
                        playersMap.set(entry.name, {
                            name: entry.name,
                            dailyPoints: {},
                            total: 0
                        });
                    }
                    const player = playersMap.get(entry.name);
                    player.dailyPoints[date] = entry.points;
                });
            });
            
            fullPlayersList = Array.from(playersMap.values());
            fullPlayersList.forEach(player => {
                let sum = 0;
                allDates.forEach(date => {
                    sum += (player.dailyPoints[date] || 0);
                });
                player.total = sum;
            });
            
            // Initial sort by total points descending to assign ranks
            fullPlayersList.sort((a, b) => b.total - a.total);
            fullPlayersList.forEach((p, i) => p.rank = i + 1);
            
            applyFilter();
        }

        window.onload = init;
    </script>
</body>
</html>
